name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The default token is already read-only at the repository level; declaring it here as well
# keeps the guarantee visible in the file and survives a change to that repository setting.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: engine tests + smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Linux carries the full Python-version coverage; the cross-platform install promise
        # (Windows / macOS, see scripts/bootstrap.py) is exercised on a single pinned 3.12 to
        # bound matrix cost. The install/test commands below are OS-agnostic (`python -m pip`,
        # `pytest`), so no per-OS shell branching is needed.
        #
        # Cover BOTH edges of the supported range, not just the floor. `requires-python = ">=3.10"`
        # has no upper bound, so users run whatever is current — and the field crash reports this
        # project has taken (the kg_context loader-lock hang) came from a Python NEWER than anything
        # CI tested. 3.13 and 3.14 pass today; without a gate that stays true only by luck (review-r11).
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Node is required for the launcher tests (tests/test_launchers.py) — the Node-dependent
      # cases skip silently when `node` is absent, so without this the .mjs parse/behavior
      # coverage would vanish with the suite still green. Pin it so the coverage is guaranteed,
      # not an accident of the runner image.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install the engine + dev/backend extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,backend]"

      - name: Run the full test suite (chaos, invariants, grounding, projector, hardening, backend)
        run: pytest tests/ -q

      - name: Stage 2 — pack validates against the source
        run: python -m kg_engine.pack validate pack/pack.yaml examples/source.md

      - name: Stage 7/8 — harness commands run and log (no human gate)
        run: |
          python -m kg_engine.harness agreement
          python -m kg_engine.harness specificity
          python -m kg_engine.harness ideation

      - name: Manifest + component structural check
        run: python scripts/validate_plugin.py

  plugin-validate:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Best-effort: requires the Claude Code CLI, which may be unavailable/unauthenticated in a
    # generic runner. The deterministic structural check in the `test` job above is the hard gate;
    # this job surfaces the real validator when the CLI is installable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin manifest
        run: claude plugin validate ./ --strict

  ci-complete:
    # One stable check name for the branch ruleset to require. Matrix legs come and go, so
    # requiring them individually would turn a dropped Python version into a required check
    # that never reports again — and an unsatisfiable required check blocks every merge.
    # This job depends on the ones that must pass and fails unless all of them succeeded.
    # plugin-validate is continue-on-error, so it stays out by its author's intent.
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read-only access to this run's jobs, for the second step. Job-level, so nothing else gains it.
    permissions:
      actions: read
    steps:
      - name: Fail unless every required job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "A required job did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
      # The step above reads the matrix's summary result, and on PR #153 (2026-11-24) that summary said success
      # while the macOS leg had never run: GitHub found no runner for it and cancelled it after 15 minutes. The
      # first step was skipped, this gate passed, and auto-merge merged the PR. So also ask the API for every
      # leg of this run, the latest attempt of each, and fail unless each one concluded success. Finding no
      # leg at all fails too, so renaming the test job can never open the gate. The API can answer a passing
      # server error (a 502 on this very PR's re-run blocked it): ask up to five times, then fail closed.
      # A leg that has just ended can read no conclusion yet ("none"): this job starts the moment the last leg
      # ends, before the API has recorded it. On PR #156 (2026-11-25) the Windows leg ended at 13:43:12Z, read
      # "none" at 13:43:16Z, and shut the gate with all six legs green. So ask again while a leg has none and
      # none has failed; on the fifth answer a leg with none still counts as not succeeded.
      - name: Fail unless every test leg ran and succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            if legs=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?filter=latest&per_page=100" \
                       --jq '.jobs[] | select(.name | startswith("engine tests")) | "\(.name)\t\(.conclusion // "none")"'); then
              waiting=$(printf '%s\n' "$legs" | awk -F'\t' '$2 == "none"' | grep -c . || true)
              failed=$(printf '%s\n' "$legs" | awk -F'\t' 'NF && $2 != "success" && $2 != "none"' | grep -c . || true)
              if [ "$waiting" -eq 0 ] || [ "$failed" -ne 0 ] || [ "$attempt" -eq 5 ]; then
                break
              fi
              echo "$waiting test leg(s) have no conclusion yet; asking again"
            elif [ "$attempt" -eq 5 ]; then
              echo "the API did not list this run's jobs after 5 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          printf '%s\n' "$legs"
          total=$(printf '%s\n' "$legs" | grep -c . || true)
          bad=$(printf '%s\n' "$legs" | awk -F'\t' '$2 != "success"' | grep -c . || true)
          if [ "$total" -eq 0 ] || [ "$bad" -ne 0 ]; then
            echo "$bad of $total test legs did not succeed"
            exit 1
          fi
          echo "all $total test legs succeeded"
